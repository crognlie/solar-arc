# Builds a Forerunner 965 .prg when GARMIN_DEVELOPER_KEY is set.
# Secret value must be the base64 encoding of developer_key.der, not the raw file.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fr965:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/blackshadev/garmin-connectiq-tools:9.2.0
    defaults:
      run:
        working-directory: watchface/garmin
    steps:
      - uses: actions/checkout@v4

      - name: Decode developer key
        env:
          GARMIN_DEVELOPER_KEY: ${{ secrets.GARMIN_DEVELOPER_KEY }}
        run: |
          if [ -z "$GARMIN_DEVELOPER_KEY" ]; then
            echo "Set repository secret GARMIN_DEVELOPER_KEY (base64 of developer_key.der)." >&2
            exit 1
          fi
          echo "$GARMIN_DEVELOPER_KEY" | base64 -d > "$HOME/developer_key.der"

      - name: Compile forerunner 965
        run: |
          mkdir -p bin
          java -jar /connectiq/bin/monkeybrains.jar \
            -f monkey.jungle \
            -y "$HOME/developer_key.der" \
            -d fr965 \
            -o bin/SolarArc.prg

      - uses: actions/upload-artifact@v4
        with:
          name: SolarArc-fr965
          path: watchface/garmin/bin/SolarArc.prg
